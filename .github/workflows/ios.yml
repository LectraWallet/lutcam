name: LUT Cam — build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LUTCam/**'
      - 'LUTCam.xcodeproj/**'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build (unsigned)
        run: |
          xcodebuild -project LUTCam.xcodeproj \
            -scheme LUTCam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/LUTCam.app" Payload/
          zip -r LUTCam-unsigned.ipa Payload
          ls -lh LUTCam-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUTCam-unsigned
          path: LUTCam-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: LUT Cam v1.0.0
          files: LUTCam-unsigned.ipa
