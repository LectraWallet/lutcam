name: LUT Cam — build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LUTCam/**'
      - 'LUTCam.xcodeproj/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project LUTCam.xcodeproj \
            -scheme LUTCam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "lutcam-ci"
          git config user.email "ci@lutcam.local"
          { grep -E "error:|BUILD FAILED" build.log | head -40; echo "--- tail ---"; tail -30 build.log; } > build-error.txt
          git add build-error.txt
          git commit -m "ci: build error log" || exit 0
          git push origin HEAD:main

      - name: Compile CoreML model
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then echo "NO .app FOUND"; exit 1; fi
          echo "App: $APP"
          PKG="$RUNNER_TEMP/RealESRGAN.mlpackage"
          rm -rf "$PKG"
          mkdir -p "$PKG/Data/com.apple.CoreML/weights"
          cp LUTCam/Models/RealESRGAN-Manifest.json "$PKG/Manifest.json"
          cp LUTCam/Models/RealESRGAN-model.bindata "$PKG/Data/com.apple.CoreML/model.mlmodel"
          cp LUTCam/Models/RealESRGAN-weights.bin "$PKG/Data/com.apple.CoreML/weights/weight.bin"
          xcrun coremlc compile "$PKG" "$APP"
          ls -la "$APP/RealESRGAN.mlmodelc"
          # Force the Files-app folder key: the generated Info.plist drops
          # UIFileSharingEnabled even when the build setting is present.
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$APP/Info.plist"

      - name: Package IPA
        run: |
          echo "--- products tree ---"
          find build/Build/Products -maxdepth 2 | head -50
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then echo "NO .app FOUND UNDER build/Build/Products"; exit 1; fi
          echo "Found app bundle: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r LUTCam-unsigned.ipa Payload
          ls -lh LUTCam-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUTCam-unsigned
          path: LUTCam-unsigned.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.6
          name: LUT Cam v1.5.2
          files: LUTCam-unsigned.ipa
